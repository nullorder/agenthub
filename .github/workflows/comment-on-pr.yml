name: Comment on plugin PR

# Posts the validation result produced by "Validate plugin submission" back to
# the PR. That workflow runs in the PR (fork) context with a read-only token
# and therefore can't comment itself. This workflow runs via workflow_run in
# the base-repo context, where the token can write to issues/PRs. It only reads
# an artifact — it never checks out or executes PR code — so it is safe to grant
# write permissions even though the triggering run was for untrusted fork code.

on:
  workflow_run:
    workflows: ["Validate plugin submission"]
    types:
      - completed

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    # Only act on runs triggered by pull requests.
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Download comment artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: pr-comment
          path: pr-comment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Post or update comment
        if: steps.download.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const body = fs.readFileSync('pr-comment/body.md', 'utf8');
            const issue_number = parseInt(
              fs.readFileSync('pr-comment/pr.txt', 'utf8').trim(),
              10,
            );
            if (!Number.isInteger(issue_number)) {
              core.setFailed('No valid PR number in artifact.');
              return;
            }

            const { owner, repo } = context.repo;

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
            });

            const marker = '## Plugin Validation';
            const existing = comments.find((c) => c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
